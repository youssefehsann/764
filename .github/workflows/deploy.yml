name: Deploy react 

on: 

  push: 

    branches:

      - master
 
 
jobs: 

  build: 

    runs-on: ubuntu-latest

    steps: 

      - uses: actions/checkout@v2

      - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - run: docker build -t ehsooo/react-test -f Dockerfile.dev . 

      - run: docker run -e CI=true ehsooo/react-test npm run test
 
      - run: docker build -t ehsooo/multi-client ./microservices/client 

      - run: docker build -t ehsooo/multi-server ./microservices/server 

      - run: docker build -t ehsooo/multi-nginx ./microservices/nginx

      - run: docker build -t ehsooo/multi-worker ./microservices/worker
 
      - run: docker push ehsooo/multi-client

      - run: docker push ehsooo/multi-server

      - run: docker push ehsooo/multi-nginx

      - run: docker push ehsooo/multi-worker
 
